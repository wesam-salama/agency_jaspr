name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.2'

      - name: Install dependencies
        run: dart pub get --enforce-lockfile

      - name: Analyze and test
        run: |
          dart analyze
          dart test

      - name: Install Jaspr CLI
        run: dart pub global activate jaspr_cli 0.23.4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build website for the Pages path
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: dart pub global run jaspr_cli:jaspr build --dart-define="SITE_BASE_PATH=$SITE_BASE_PATH"

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/jaspr

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
