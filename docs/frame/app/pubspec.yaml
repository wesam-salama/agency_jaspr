name: frame_academy
description: Frame Academy — authored local learning demonstration.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.13.2
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  app_links: 6.4.0
  video_player: 2.10.0
  marionette_flutter: 0.6.0
  shared_preferences: 2.5.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/sample-practice.png
  fonts:
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/space-grotesk-latin.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/inter-latin.ttf
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/ibm-plex-sans-arabic-regular.ttf
        - asset: assets/fonts/ibm-plex-sans-arabic-semibold.ttf
          weight: 600
